{% extends 'tracker/auth_base.html' %}
{% block content %}
    <h1>
        Forgot Password
    </h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">
            Continue
        </button>
    </form>
    <p>
        Recovery requires a security question previously configured during registration or on Profile.
    </p>
    <a href="{% url 'login' %}">
        Return to Login
    </a>
{% endblock %}

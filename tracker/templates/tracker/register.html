{# Show the form for creating an account and choosing a recovery question. #}
<!DOCTYPE html>
<html>
    <head>
        <title>
            Quiver - Register
        </title>
    </head>
    <body>
        <h1>
            Create Account
        </h1>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">
                Create Account
            </button>
        </form>
        <p>
            Already have an account?
            <a href="{% url 'login' %}">
                Login
            </a>
        </p>
    </body>
</html>

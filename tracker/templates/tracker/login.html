<!DOCTYPE html>
<html>
<head>
    <title>Quiver - Login</title>
</head>

<body>

    <h1>Quiver</h1>

    <h2>Login</h2>

    <form method="POST">

        {% csrf_token %}

        <label for="username">Username</label>
        <br>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Username..."
            required
        >

        <br><br>

        <label for="password">Password</label>
        <br>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Password..."
            required
        >

        <br><br>

        <button type="submit">Login</button>

    </form>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <p>
        Don't have an account?
        <a href="{% url 'register' %}">Sign up</a>
    </p>

</body>
</html>

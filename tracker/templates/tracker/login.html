{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>
            Quiver - Login
        </title>
        <link rel="stylesheet" href="{% static 'tracker/css/login.css' %}">
    </head>
    <body>
        <div class="login-container">
            <div class="logo-card">
                <img
                    src="{% static 'tracker/images/QuiverLightLogo.png' %}"
                    alt="Quiver logo"
                    class="logo-image"
                >
            </div>
            <form method="POST" class="login-form">
                {% csrf_token %}
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Username..."
                    required
                >
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password..."
                    required
                >
                <a href="{% url 'password_reset' %}" class="forgot-link">
                    forgot password?
                </a>
                <button type="submit">
                    Login
                </button>
            </form>
            {% if error %}
                <p class="error-text">
                    {{ error }}
                </p>
            {% endif %}
            {% for message in messages %}
                <p>
                    {{ message }}
                </p>
            {% endfor %}
            <p class="signup-text">
                don't have an account?
                <a href="{% url 'register' %}">
                    sign up
                </a>
            </p>
        </div>
    </body>
</html>

{% extends 'tracker/auth_base.html' %}
{% block content %}
    <h1>
        Answer Your Security Question
    </h1>
    <p>
        {{ question }}
    </p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">
            Verify Answer
        </button>
    </form>
    <a href="{% url 'password_reset' %}">
        Start Again
    </a>
    <a href="{% url 'login' %}">
        Return to Login
    </a>
{% endblock %}
